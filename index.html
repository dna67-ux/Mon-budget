<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>✦ Mon Budget Personnel</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FAF7F2;font-family:Georgia,'Times New Roman',serif}
.card{background:#FFFEF9;border-radius:16px;padding:20px;box-shadow:0 2px 16px rgba(90,70,50,.08)}
h3{font-size:15px;font-weight:700;color:#3D3530;letter-spacing:.3px}
input,select{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#F0EAE0}
::-webkit-scrollbar-thumb{background:#A8C5AC;border-radius:99px}
button{transition:opacity .2s,transform .2s;font-family:inherit}
button:hover{opacity:.85;transform:translateY(-1px)}
tr:hover td{background:#F0EAE0!important}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useRef}=React;

/* ─── Couleurs ─────────────────────────────────────── */
const sage='#7A9E7E',sageDk='#5C7A60',sageLt='#A8C5AC',sagePale='#D6E8D8';
const cream='#FAF7F2',beige='#F0EAE0',beige2='#E8DFD0',white='#FFFEF9';
const txt='#3D3530',txtM='#8A7E76',txtL='#B5A99E';
const gold='#C9A96E',goldLt='#E8D5B0',rose='#D4A5A5';
const terra='#C97B5A',sky='#8BB5C8',lav='#B5A8C8',err='#C97B7B';
const PIE=[sage,gold,rose,terra,sky,lav,'#A8C5AC','#D4C5A9','#8BAAB5','#C5B8D4','#B5C8A8','#D4B8A5'];

/* ─── Helpers ──────────────────────────────────────── */
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const pct=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().split('T')[0];

/* ─── Données ──────────────────────────────────────── */
const CAT_REV=['Salaire','Prime','Cadeau','Vente','Autre'];
const CAT_FIX=['Loyer','Électricité','Eau','Internet','Téléphone','Assurance','Transport','Abonnements'];
const CAT_VAR=['Courses alimentaires','Restaurant','Loisirs','Vêtements','Beauté','Santé','Sport','Cadeaux','Animaux','Voyage','Divers'];
const CAT_DEP=[...CAT_FIX,...CAT_VAR];
const CAT_EP=["Fonds d'urgence",'Projet Hijra','Vacances','Achat important','Investissement'];
const TABS=[
  {id:'dash',ic:'✦',lb:'Tableau de bord'},{id:'rev',ic:'↑',lb:'Revenus'},
  {id:'dep',ic:'↓',lb:'Dépenses'},{id:'ep',ic:'◈',lb:'Épargne'},
  {id:'dette',ic:'⇄',lb:'Dettes'},{id:'vac',ic:'✈',lb:'Vacances'},
  {id:'abo',ic:'⟳',lb:'Abonnements'},{id:'obj',ic:'◎',lb:'Objectifs'},
  {id:'chart',ic:'❋',lb:'Graphiques'},
];

/* ─── Atomes UI ────────────────────────────────────── */
const Card=({ch,st={}})=><div className="card" style={st}>{ch}</div>;

const Pill=({color,children})=><span style={{
  background:color+'22',color,border:`1px solid ${color}44`,
  borderRadius:20,padding:'2px 10px',fontSize:11,fontWeight:600,whiteSpace:'nowrap'
}}>{children}</span>;

const Prog=({v,color=sage,bg=sagePale})=>(
  <div style={{background:bg,borderRadius:99,height:8,overflow:'hidden',width:'100%'}}>
    <div style={{width:`${Math.min(100,v)}%`,height:'100%',
      background:`linear-gradient(90deg,${color}99,${color})`,
      borderRadius:99,transition:'width .6s'}}/>
  </div>
);

/* INPUT UNCONTROLLED — évite le blocage */
const Inp=({defaultValue='',onBlurSave,type='text',placeholder,style={}})=>{
  const ref=useRef(null);
  return <input ref={ref} type={type} defaultValue={defaultValue} placeholder={placeholder}
    onBlur={e=>onBlurSave&&onBlurSave(e.target.value)}
    style={{background:white,border:`1.5px solid ${beige2}`,borderRadius:10,
      padding:'7px 12px',fontSize:13,color:txt,outline:'none',width:'100%',...style}}
    onFocus={e=>e.target.style.borderColor=sage}
    onBlurCapture={e=>e.target.style.borderColor=beige2}/>;
};

/* SELECT */
const Sel=({value,onChange,opts})=>(
  <select value={value} onChange={e=>onChange(e.target.value)}
    style={{background:white,border:`1.5px solid ${beige2}`,borderRadius:10,
      padding:'7px 12px',fontSize:13,color:txt,outline:'none',cursor:'pointer',width:'100%'}}>
    {opts.map(o=><option key={o} value={o}>{o}</option>)}
  </select>
);

/* BOUTON */
const Btn=({onClick,children,v='pri',sm=false,st={}})=>{
  const vars={
    pri:{background:sage,color:'#fff',border:'none'},
    ghost:{background:'transparent',color:sageDk,border:`1.5px solid ${sage}`},
    danger:{background:err+'22',color:err,border:`1px solid ${err}44`},
  };
  return <button onClick={onClick} style={{borderRadius:10,cursor:'pointer',fontWeight:600,
    padding:sm?'5px 12px':'8px 18px',fontSize:sm?12:13,...vars[v],...st}}>{children}</button>;
};

/* ─── Camembert SVG ────────────────────────────────── */
function Pie({data,size=160}){
  const tot=data.reduce((s,d)=>s+d.v,0);
  if(!tot)return <div style={{width:size,height:size,borderRadius:'50%',background:beige,
    display:'flex',alignItems:'center',justifyContent:'center',color:txtL,fontSize:13}}>Aucune donnée</div>;
  let ang=-Math.PI/2;
  const cx=size/2,cy=size/2,r=size/2-10;
  const sl=data.map((d,i)=>{
    const sw=d.v/tot*2*Math.PI,x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
    ang+=sw;
    const x2=cx+r*Math.cos(ang),y2=cy+r*Math.sin(ang),lg=sw>Math.PI?1:0;
    return{p:`M${cx},${cy} L${x1},${y1} A${r},${r},0,${lg},1,${x2},${y2} Z`,c:PIE[i%PIE.length],lb:d.lb};
  });
  return <svg width={size} height={size}>
    {sl.map((s,i)=><path key={i} d={s.p} fill={s.c} stroke={white} strokeWidth={2}/>)}
    <circle cx={cx} cy={cy} r={r*.42} fill={white}/>
  </svg>;
}

/* ─── Barres ───────────────────────────────────────── */
function Bars({data,h=160}){
  if(!data.length)return <div style={{height:h,display:'flex',alignItems:'center',
    justifyContent:'center',color:txtL,fontSize:13}}>Aucune donnée</div>;
  const mx=Math.max(...data.flatMap(d=>[d.rev||0,d.dep||0]),1);
  return <div style={{display:'flex',alignItems:'flex-end',gap:10,height:h,padding:'0 8px'}}>
    {data.map((d,i)=>(
      <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
        <div style={{display:'flex',gap:3,alignItems:'flex-end',height:h-30}}>
          {d.rev!==undefined&&<div style={{width:14,height:`${d.rev/mx*100}%`,minHeight:2,
            background:`linear-gradient(180deg,${sageLt},${sage})`,borderRadius:'4px 4px 0 0'}}
            title={`Revenus: ${eur(d.rev)}`}/>}
          {d.dep!==undefined&&<div style={{width:14,height:`${d.dep/mx*100}%`,minHeight:2,
            background:`linear-gradient(180deg,${goldLt},${gold})`,borderRadius:'4px 4px 0 0'}}
            title={`Dépenses: ${eur(d.dep)}`}/>}
        </div>
        <span style={{fontSize:10,color:txtM,textAlign:'center'}}>{d.lb}</span>
      </div>
    ))}
  </div>;
}

/* ─── Tableau générique avec formulaire d'ajout ─────── */
function Table({rows,onAdd,onDel,cols,lbAdd,catOpts}){
  /* Formulaire en état local — chaque champ est libre */
  const [cat,setCat]=useState(catOpts[0]);
  const [status,setStatus]=useState(cols.find(c=>c.k==='status')?.opts?.[0]||'');
  const refs=useRef({});

  const handleAdd=()=>{
    const row={id:uid()};
    cols.forEach(c=>{
      if(c.k==='category') row[c.k]=cat;
      else if(c.k==='status') row[c.k]=status;
      else{
        const v=refs.current[c.k]?.value||'';
        row[c.k]=c.type==='number'?Number(v):v;
      }
    });
    if(cols.filter(c=>c.req).some(c=>!row[c.k]))return;
    onAdd(row);
    cols.forEach(c=>{
      if(c.k!=='category'&&c.k!=='status'&&refs.current[c.k]){
        refs.current[c.k].value = c.k==='date'?today():'';
      }
    });
  };

  return <div>
    <div style={{overflowX:'auto'}}>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
        <thead>
          <tr style={{background:beige}}>
            {cols.map(c=><th key={c.k} style={{padding:'10px 14px',textAlign:'left',
              fontWeight:600,color:txtM,fontSize:12,whiteSpace:'nowrap'}}>{c.lb}</th>)}
            <th style={{width:48}}/>
          </tr>
        </thead>
        <tbody>
          {rows.length===0&&<tr><td colSpan={cols.length+1}
            style={{padding:24,textAlign:'center',color:txtL,fontSize:13}}>Aucune entrée</td></tr>}
          {rows.map((row,i)=>(
            <tr key={row.id} style={{background:i%2===0?white:cream}}>
              {cols.map(c=>(
                <td key={c.k} style={{padding:'9px 14px',color:txt}}>
                  {c.k==='category'?<Pill color={sage}>{row[c.k]}</Pill>
                    :c.k==='amount'?<b style={{color:sageDk}}>{eur(row[c.k])}</b>
                    :c.k==='status'?<Pill color={row[c.k]==='Payé'||row[c.k]==='Remboursé'?sage:gold}>{row[c.k]}</Pill>
                    :row[c.k]}
                </td>
              ))}
              <td style={{padding:'9px 14px'}}>
                <Btn onClick={()=>onDel(row.id)} v='danger' sm>✕</Btn>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>

    {/* Formulaire */}
    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14,
      padding:14,background:beige,borderRadius:12,alignItems:'flex-end'}}>
      {cols.map(c=>(
        <div key={c.k} style={{flex:c.fl||1,minWidth:100}}>
          <div style={{fontSize:11,color:txtM,marginBottom:4,fontWeight:600}}>{c.lb}</div>
          {c.k==='category'
            ?<Sel value={cat} onChange={setCat} opts={c.opts||catOpts}/>
            :c.k==='status'
            ?<Sel value={status} onChange={setStatus} opts={c.opts||[]}/>
            :<input
              ref={el=>{if(el)refs.current[c.k]=el}}
              type={c.type||'text'}
              defaultValue={c.k==='date'?today():''}
              placeholder={c.ph||''}
              style={{background:white,border:`1.5px solid ${beige2}`,borderRadius:10,
                padding:'7px 12px',fontSize:13,color:txt,outline:'none',width:'100%'}}
              onFocus={e=>e.target.style.borderColor=sage}
              onBlur={e=>e.target.style.borderColor=beige2}/>
          }
        </div>
      ))}
      <Btn onClick={handleAdd}>+ {lbAdd}</Btn>
    </div>
  </div>;
}

/* ══════════════════════════════════════════════════════
   APP PRINCIPALE
══════════════════════════════════════════════════════ */
function App(){
  const [tab,setTab]=useState('dash');

  const [revs,setRevs]=useState([
    {id:uid(),date:'2025-01-05',desc:'Salaire janvier',category:'Salaire',amount:2400},
    {id:uid(),date:'2025-01-20',desc:'Freelance',category:'Vente',amount:350},
  ]);
  const [deps,setDeps]=useState([
    {id:uid(),date:'2025-01-01',desc:'Loyer',category:'Loyer',amount:750},
    {id:uid(),date:'2025-01-02',desc:'EDF',category:'Électricité',amount:62},
    {id:uid(),date:'2025-01-05',desc:'Courses Lidl',category:'Courses alimentaires',amount:85},
    {id:uid(),date:'2025-01-10',desc:'Restaurant anniversaire',category:'Restaurant',amount:48},
    {id:uid(),date:'2025-01-12',desc:'Pharmacie',category:'Santé',amount:24},
    {id:uid(),date:'2025-01-18',desc:'Abonnements streaming',category:'Abonnements',amount:27},
  ]);
  const [eps,setEps]=useState([
    {id:uid(),name:"Fonds d'urgence",target:5000,saved:1800},
    {id:uid(),name:'Projet Hijra',target:15000,saved:3200},
    {id:uid(),name:'Vacances',target:2000,saved:650},
  ]);
  const [dettesJe,setDettesJe]=useState([
    {id:uid(),person:'Marie',reason:'Soirée resto',amount:35,dueDate:'2025-02-01',status:'À payer'},
  ]);
  const [dettesEux,setDettesEux]=useState([
    {id:uid(),person:'Sophie',reason:'Billet concert',amount:60,dueDate:'2025-01-28',status:'En attente'},
  ]);
  const [vacs,setVacs]=useState([
    {id:uid(),dest:'Maroc',budget:1500,saved:650,date:'2025-08-15'},
  ]);
  const [abos,setAbos]=useState([
    {id:uid(),name:'Netflix',price:17.99,day:1},
    {id:uid(),name:'Spotify',price:9.99,day:5},
    {id:uid(),name:'Téléphone',price:19.99,day:10},
    {id:uid(),name:'Salle de sport',price:29.99,day:1},
    {id:uid(),name:'Internet',price:34.99,day:15},
  ]);
  const [objs,setObjs]=useState([
    {id:uid(),name:'Voiture',target:8000,reached:2100,deadline:'2026-06-01'},
    {id:uid(),name:'Formation',target:1200,reached:800,deadline:'2025-09-01'},
  ]);

  /* Formulaires simples */
  const [fEp,setFEp]=useState({name:CAT_EP[0],target:'',saved:''});
  const [fVac,setFVac]=useState({dest:'',budget:'',saved:'',date:''});
  const [fAbo,setFAbo]=useState({name:'',price:'',day:''});
  const [fObj,setFObj]=useState({name:'',target:'',reached:'',deadline:''});

  /* ── Calculs ── */
  const st=useMemo(()=>{
    const totR=revs.reduce((s,r)=>s+r.amount,0);
    const totD=deps.reduce((s,r)=>s+r.amount,0);
    const fix=deps.filter(d=>CAT_FIX.includes(d.category)).reduce((s,r)=>s+r.amount,0);
    const vari=deps.filter(d=>CAT_VAR.includes(d.category)).reduce((s,r)=>s+r.amount,0);
    const bal=totR-totD;
    const epRate=totR>0?Math.round(bal/totR*100):0;
    const totA=abos.reduce((s,a)=>s+a.price,0);
    return{totR,totD,fix,vari,bal,epRate,totA};
  },[revs,deps,abos]);

  const byCat=useMemo(()=>{
    const m={};
    deps.forEach(d=>{m[d.category]=(m[d.category]||0)+d.amount;});
    return Object.entries(m).map(([lb,v])=>({lb,v})).sort((a,b)=>b.v-a.v);
  },[deps]);

  const monthly=useMemo(()=>[
    {lb:'Août',rev:2200,dep:1650},{lb:'Sep',rev:2400,dep:1820},
    {lb:'Oct',rev:2350,dep:1710},{lb:'Nov',rev:2600,dep:1950},
    {lb:'Déc',rev:2800,dep:2200},{lb:'Jan',rev:st.totR,dep:st.totD},
  ],[st]);

  /* ══════ SECTIONS ══════ */

  const Dash=()=>(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(165px,1fr))',gap:16,marginBottom:24}}>
        {[
          {ic:'↑',lb:'Revenus du mois',val:eur(st.totR),col:sage,bg:sagePale},
          {ic:'↓',lb:'Dépenses du mois',val:eur(st.totD),col:gold,bg:goldLt+'66'},
          {ic:'◈',lb:'Solde restant',val:eur(st.bal),col:st.bal>=0?sageDk:err,bg:st.bal>=0?sagePale:rose+'44'},
          {ic:'✦',lb:"Taux d'épargne",val:`${Math.max(0,st.epRate)}%`,col:sky,bg:sky+'22'},
          {ic:'⟳',lb:'Abonnements',val:eur(st.totA),col:lav,bg:lav+'22'},
          {ic:'◎',lb:'Nb dépenses',val:deps.length,col:terra,bg:terra+'22'},
        ].map((s,i)=>(
          <div key={i} className="card" style={{background:s.bg,border:`1.5px solid ${s.col}33`}}>
            <div style={{fontSize:22,marginBottom:8}}>{s.ic}</div>
            <div style={{fontSize:11,color:txtM,fontWeight:600,textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>{s.lb}</div>
            <div style={{fontSize:22,fontWeight:800,color:s.col}}>{s.val}</div>
          </div>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
        <div className="card">
          <h3 style={{marginBottom:16}}>Répartition des dépenses</h3>
          <div style={{display:'flex',gap:20,alignItems:'center',flexWrap:'wrap'}}>
            <Pie data={byCat} size={150}/>
            <div style={{flex:1}}>
              {byCat.slice(0,7).map((d,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                  <div style={{width:10,height:10,borderRadius:3,background:PIE[i%PIE.length],flexShrink:0}}/>
                  <span style={{fontSize:12,color:txt,flex:1}}>{d.lb}</span>
                  <span style={{fontSize:12,fontWeight:700,color:txtM}}>{eur(d.v)}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
        <div className="card">
          <h3 style={{marginBottom:16}}>Évolution Revenus / Dépenses</h3>
          <div style={{display:'flex',gap:12,marginBottom:10}}>
            <div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:12,height:12,borderRadius:3,background:sage}}/><span style={{fontSize:12,color:txtM}}>Revenus</span></div>
            <div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:12,height:12,borderRadius:3,background:gold}}/><span style={{fontSize:12,color:txtM}}>Dépenses</span></div>
          </div>
          <Bars data={monthly} h={170}/>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div className="card">
          <h3 style={{marginBottom:14}}>Charges fixes vs Variables</h3>
          {[{lb:'Charges fixes',val:st.fix,col:terra},{lb:'Dépenses variables',val:st.vari,col:lav}].map((r,i)=>(
            <div key={i} style={{marginBottom:14}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                <span style={{fontSize:13,color:txt}}>{r.lb}</span>
                <span style={{fontSize:13,fontWeight:700,color:r.col}}>{eur(r.val)}</span>
              </div>
              <Prog v={pct(r.val,st.totD)} color={r.col} bg={r.col+'22'}/>
            </div>
          ))}
        </div>
        <div className="card">
          <h3 style={{marginBottom:14}}>Objectifs d'épargne</h3>
          {eps.slice(0,3).map(s=>(
            <div key={s.id} style={{marginBottom:14}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                <span style={{fontSize:13,color:txt}}>{s.name}</span>
                <span style={{fontSize:12,color:txtM}}>{pct(s.saved,s.target)}%</span>
              </div>
              <Prog v={pct(s.saved,s.target)}/>
              <div style={{fontSize:11,color:txtL,marginTop:4}}>{eur(s.saved)} / {eur(s.target)}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  const Revenus=()=>(
    <div>
      <div style={{display:'flex',gap:12,marginBottom:20,flexWrap:'wrap'}}>
        <div className="card" style={{background:sagePale,flex:1,minWidth:160}}>
          <div style={{fontSize:11,color:sageDk,fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>Total Revenus</div>
          <div style={{fontSize:28,fontWeight:800,color:sageDk,marginTop:4}}>{eur(st.totR)}</div>
        </div>
        <div className="card" style={{flex:1,minWidth:160}}>
          <div style={{fontSize:11,color:txtM,fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>Entrées</div>
          <div style={{fontSize:28,fontWeight:800,color:txt,marginTop:4}}>{revs.length}</div>
        </div>
      </div>
      <div className="card">
        <Table rows={revs.map(r=>({...r,desc:r.desc}))}
          onAdd={r=>setRevs(p=>[...p,{...r,desc:r.desc,amount:Number(r.amount)}])}
          onDel={id=>setRevs(p=>p.filter(r=>r.id!==id))}
          lbAdd="Revenu" catOpts={CAT_REV}
          cols={[
            {k:'date',lb:'Date',type:'date',req:true,fl:1},
            {k:'desc',lb:'Description',req:true,fl:2,ph:'Ex: Salaire mars'},
            {k:'category',lb:'Catégorie',opts:CAT_REV,fl:1.5},
            {k:'amount',lb:'Montant (€)',type:'number',req:true,fl:1,ph:'0.00'},
          ]}/>
      </div>
    </div>
  );

  const Depenses=()=>(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12,marginBottom:20}}>
        {[
          {lb:'Total dépenses',val:eur(st.totD),col:gold},
          {lb:'Charges fixes',val:eur(st.fix),col:terra},
          {lb:'Dépenses variables',val:eur(st.vari),col:lav},
          {lb:'Argent restant',val:eur(st.bal),col:sage},
        ].map((s,i)=>(
          <div key={i} className="card" style={{borderLeft:`4px solid ${s.col}`}}>
            <div style={{fontSize:11,color:txtM,fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>{s.lb}</div>
            <div style={{fontSize:20,fontWeight:800,color:s.col,marginTop:4}}>{s.val}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <Table rows={deps}
          onAdd={r=>setDeps(p=>[...p,{...r,amount:Number(r.amount)}])}
          onDel={id=>setDeps(p=>p.filter(r=>r.id!==id))}
          lbAdd="Dépense" catOpts={CAT_DEP}
          cols={[
            {k:'date',lb:'Date',type:'date',req:true,fl:1},
            {k:'desc',lb:'Description',req:true,fl:2,ph:'Ex: Loyer'},
            {k:'category',lb:'Catégorie',opts:CAT_DEP,fl:1.5},
            {k:'amount',lb:'Montant (€)',type:'number',req:true,fl:1,ph:'0.00'},
          ]}/>
      </div>
    </div>
  );

  const Epargne=()=>(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:16,marginBottom:20}}>
        {eps.map(s=>{
          const addRef=useRef(null);
          return (
            <div key={s.id} className="card" style={{borderTop:`3px solid ${sage}`}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
                <div>
                  <div style={{fontWeight:700,color:txt,fontSize:15}}>{s.name}</div>
                  <div style={{fontSize:12,color:txtM,marginTop:2}}>{eur(s.saved)} épargnés</div>
                </div>
                <Pill color={pct(s.saved,s.target)>=100?sage:gold}>{pct(s.saved,s.target)}%</Pill>
              </div>
              <Prog v={pct(s.saved,s.target)}/>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:10,fontSize:12}}>
                <span style={{color:txtM}}>Objectif : <b>{eur(s.target)}</b></span>
                <span style={{color:sage}}>Reste : <b>{eur(Math.max(0,s.target-s.saved))}</b></span>
              </div>
              <div style={{display:'flex',gap:8,marginTop:12}}>
                <input ref={addRef} type="number" placeholder="Ajouter € (Entrée)"
                  style={{background:white,border:`1.5px solid ${beige2}`,borderRadius:10,
                    padding:'7px 12px',fontSize:12,color:txt,outline:'none',flex:1}}
                  onKeyDown={e=>{if(e.key==='Enter'){const v=Number(e.target.value);
                    if(v>0)setEps(p=>p.map(x=>x.id===s.id?{...x,saved:x.saved+v}:x));
                    e.target.value='';}}}/>
                <Btn v='danger' sm onClick={()=>setEps(p=>p.filter(x=>x.id!==s.id))}>✕</Btn>
              </div>
            </div>
          );
        })}
      </div>
      <div className="card">
        <h3 style={{marginBottom:14}}>Ajouter un objectif d'épargne</h3>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div style={{flex:1,minWidth:140}}>
            <div style={{fontSize:11,color:txtM,marginBottom:4,fontWeight:600}}>Catégorie</div>
            <Sel value={fEp.name} onChange={v=>setFEp(p=>({...p,name:v}))} opts={CAT_EP}/>
          </div>
          {[{k:'target',lb:'Objectif (€)',ph:'5000'},{k:'saved',lb:'Déjà épargné (€)',ph:'0'}].map(f=>(
            <div key={f.k} style={{flex:1,minWidth:120}}>
              <div style={{fontSize:11,color:txtM,marginBottom:4,fontWeight:600}}>{f.lb}</div>
              <input type="number" value={fEp[f.k]} placeholder={f.ph}
                onChange={e=>setFEp(p=>({...p,[f.k]:e.target.value}))}
                style={{background:white,border:`1.5px solid ${beige2}`,borderRadius:10,
                  padding:'7px 12px',fontSize:13,color:txt,outline:'none',width:'100%'}}
                onFocus={e=>e.target.style.borderColor=sage}
                onBlur={e=>e.target.style.borderColor=beige2}/>
            </div>
          ))}
          <Btn onClick={()=>{
            if(!fEp.target)return;
            setEps(p=>[...p,{id:uid(),name:fEp.name,target:Number(fEp.target),saved:Number(fEp.saved)||0}]);
            setFEp({name:CAT_EP[0],target:'',saved:''});
          }}>+ Ajouter</Btn>
        </div>
      </div>
    </div>
  );

  const Dettes=()=>(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:20}}>
        <div className="card" style={{background:rose+'33',borderLeft:`4px solid ${err}`}}>
          <div style={{fontSize:11,color:err,fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>Je dois</div>
          <div style={{fontSize:24,fontWeight:800,color:err,marginTop:4}}>{eur(dettesJe.filter(d=>d.status!=='Payé').reduce((s,r)=>s+r.amount,0))}</div>
        </div>
        <div className="card" style={{background:sagePale,borderLeft:`4px solid ${sage}`}}>
          <div style={{fontSize:11,color:sageDk,fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>On me doit</div>
          <div style={{fontSize:24,fontWeight:800,color:sageDk,marginTop:4}}>{eur(dettesEux.filter(d=>d.status!=='Remboursé').reduce((s,r)=>s+r.amount,0))}</div>
        </div>
      </div>
      <div className="card" style={{marginBottom:16}}>
        <h3 style={{marginBottom:14,color:err}}>💸 Argent que je dois</h3>
        <Table rows={dettesJe}
          onAdd={r=>setDettesJe(p=>[...p,{...r,amount:Number(r.amount)}])}
          onDel={id=>setDettesJe(p=>p.filter(r=>r.id!==id))}
          lbAdd="Dette" catOpts={['À payer','Payé']}
          cols={[
            {k:'person',lb:'Personne',req:true,fl:1,ph:'Nom'},
            {k:'reason',lb:'Motif',fl:2,ph:'Ex: Resto'},
            {k:'amount',lb:'Montant (€)',type:'number',req:true,fl:1,ph:'0.00'},
            {k:'dueDate',lb:'Date prévue',type:'date',fl:1},
            {k:'status',lb:'Statut',opts:['À payer','Payé'],fl:1},
          ]}/>
      </div>
      <div className="card">
        <h3 style={{marginBottom:14,color:sage}}>💰 Argent qu'on me doit</h3>
        <Table rows={dettesEux}
          onAdd={r=>setDettesEux(p=>[...p,{...r,amount:Number(r.amount)}])}
          onDel={id=>setDettesEux(p=>p.filter(r=>r.id!==id))}
          lbAdd="Créance" catOpts={['En attente','Remboursé']}
          cols={[
            {k:'person',lb:'Personne',req:true,fl:1,ph:'Nom'},
            {k:'reason',lb:'Motif',fl:2,ph:'Ex: Concert'},
            {k:'amount',lb:'Montant (€)',type:'number',req:true,fl:1,ph:'0.00'},
            {k:'dueDate',lb:'Date prévue',type:'date',fl:1},
            {k:'status',lb:'Statut',opts:['En attente','Remboursé'],fl:1},
          ]}/>
      </div>
    </div>
  );

  const Vacances=()=>(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:16,marginBottom:20}}>
        {vacs.map(v=>(
          <div key={v.id} className="card" style={{borderTop:`3px solid ${sky}`}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
              <div>
                <div style={{fontWeight:700,fontSize:16,color:txt}}>✈ {v.dest}</div>
                <div style={{fontSize:12,color:txtM,marginTop:2}}>Départ : {v.date||'—'}</div>
              </div>
              <Pill color={sky}>{pct(v.saved,v.budget)}%</Pill>
            </div>
            <Prog v={pct(v.saved,v.budget)} color={sky} bg={sky+'22'}/>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:10,fontSize:12}}>
              <span>Budget : <b>{eur(v.budget)}</b></span>
              <span style={{color:sky}}>Mis de côté : <b>{eur(v.saved)}</b></span>
            </div>
            <div style={{fontSize:12,color:err,marginTop:4}}>Reste : {eur(Math.max(0,v.budget-v.saved))}</div>
            <Btn v='danger' sm st={{marginTop:10}} onClick={()=>setVacs(p=>p.filter(x=>x.id!==v.id))}>Supprimer</Btn>
          </div>
        ))}
      </div>
      <div className="card">
        <h3 style={{marginBottom:14}}>Ajouter une destination</h3>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          {[{k:'dest',lb:'Destination',ph:'Ex: Maroc'},{k:'budget',lb:'Budget (€)',ph:'0.00'},{k:'saved',lb:'Mis de côté (€)',ph:'0.00'},{k:'date',lb:'Date voyage',ph:''}].map(f=>(
            <div key={f.k} style={{flex:1,minWidth:130}}>
              <div style={{fontSize:11,color:txtM,marginBottom:4,fontWeight:600}}>{f.lb}</div>
              <input type={f.k==='budget'||f.k==='saved'?'number':f.k==='date'?'date':'text'}
                value={fVac[f.k]} placeholder={f.ph}
                onChange={e=>setFVac(p=>({...p,[f.k]:e.target.value}))}
                style={{background:white,border:`1.5px solid ${beige2}`,borderRadius:10,
                  padding:'7px 12px',fontSize:13,color:txt,outline:'none',width:'100%'}}
                onFocus={e=>e.target.style.borderColor=sage}
                onBlur={e=>e.target.style.borderColor=beige2}/>
            </div>
          ))}
          <Btn onClick={()=>{
            if(!fVac.dest||!fVac.budget)return;
            setVacs(p=>[...p,{id:uid(),dest:fVac.dest,budget:Number(fVac.budget),saved:Number(fVac.saved)||0,date:fVac.date}]);
            setFVac({dest:'',budget:'',saved:'',date:''});
          }}>+ Ajouter</Btn>
        </div>
      </div>
    </div>
  );

  const Abonnements=()=>(
    <div>
      <div className="card" style={{background:lav+'22',marginBottom:20,borderLeft:`4px solid ${lav}`}}>
        <div style={{fontSize:11,color:lav,fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>Total mensuel</div>
        <div style={{fontSize:32,fontWeight:800,color:lav,marginTop:4}}>{eur(st.totA)}</div>
        <div style={{fontSize:12,color:txtM,marginTop:4}}>soit {eur(st.totA*12)} par an</div>
      </div>
      <div className="card">
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead><tr style={{background:beige}}>
              {['Abonnement','Prix mensuel','Prélèvement',''].map(h=><th key={h} style={{padding:'10px 14px',textAlign:'left',fontWeight:600,color:txtM,fontSize:12}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {abos.map((a,i)=>(
                <tr key={a.id} style={{background:i%2===0?white:cream}}>
                  <td style={{padding:'10px 14px',fontWeight:600,color:txt}}>{a.name}</td>
                  <td style={{padding:'10px 14px'}}><b style={{color:lav}}>{eur(a.price)}</b></td>
                  <td style={{padding:'10px 14px',color:txtM}}>le {a.day}</td>
                  <td style={{padding:'10px 14px'}}><Btn v='danger' sm onClick={()=>setAbos(p=>p.filter(x=>x.id!==a.id))}>✕</Btn></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{display:'flex',gap:10,marginTop:14,padding:14,background:beige,borderRadius:12,flexWrap:'wrap',alignItems:'flex-end'}}>
          {[{k:'name',lb:'Nom',ph:'Ex: Disney+'},{k:'price',lb:'Prix (€)',ph:'9.99'},{k:'day',lb:'Jour prélèvement',ph:'1-31'}].map(f=>(
            <div key={f.k} style={{flex:1,minWidth:120}}>
              <div style={{fontSize:11,color:txtM,marginBottom:4,fontWeight:600}}>{f.lb}</div>
              <input type={f.k==='price'||f.k==='day'?'number':'text'}
                value={fAbo[f.k]} placeholder={f.ph}
                onChange={e=>setFAbo(p=>({...p,[f.k]:e.target.value}))}
                style={{background:white,border:`1.5px solid ${beige2}`,borderRadius:10,
                  padding:'7px 12px',fontSize:13,color:txt,outline:'none',width:'100%'}}
                onFocus={e=>e.target.style.borderColor=sage}
                onBlur={e=>e.target.style.borderColor=beige2}/>
            </div>
          ))}
          <Btn onClick={()=>{
            if(!fAbo.name||!fAbo.price)return;
            setAbos(p=>[...p,{id:uid(),name:fAbo.name,price:Number(fAbo.price),day:fAbo.day||'—'}]);
            setFAbo({name:'',price:'',day:''});
          }}>+ Ajouter</Btn>
        </div>
      </div>
    </div>
  );

  const Objectifs=()=>(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:16,marginBottom:20}}>
        {objs.map((g,i)=>{
          const p=pct(g.reached,g.target),col=PIE[i%PIE.length];
          const addRef=useRef(null);
          return(
            <div key={g.id} className="card" style={{borderTop:`3px solid ${col}`}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                <div style={{fontWeight:700,fontSize:15,color:txt}}>◎ {g.name}</div>
                <Pill color={p>=100?sage:col}>{p>=100?'✓ Atteint':`${p}%`}</Pill>
              </div>
              <Prog v={p} color={col} bg={col+'22'}/>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:10,fontSize:12}}>
                <span>Cible : <b>{eur(g.target)}</b></span>
                <span style={{color:col}}>Atteint : <b>{eur(g.reached)}</b></span>
              </div>
              {g.deadline&&<div style={{fontSize:11,color:txtM,marginTop:4}}>Échéance : {g.deadline}</div>}
              <div style={{display:'flex',gap:8,marginTop:12}}>
                <input ref={addRef} type="number" placeholder="Ajouter € (Entrée)"
                  style={{background:white,border:`1.5px solid ${beige2}`,borderRadius:10,
                    padding:'7px 12px',fontSize:12,color:txt,outline:'none',flex:1}}
                  onKeyDown={e=>{if(e.key==='Enter'){const v=Number(e.target.value);
                    if(v>0)setObjs(prev=>prev.map(x=>x.id===g.id?{...x,reached:Math.min(x.target,x.reached+v)}:x));
                    e.target.value='';}}}/>
                <Btn v='danger' sm onClick={()=>setObjs(p=>p.filter(x=>x.id!==g.id))}>✕</Btn>
              </div>
            </div>
          );
        })}
      </div>
      <div className="card">
        <h3 style={{marginBottom:14}}>Nouvel objectif financier</h3>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          {[{k:'name',lb:'Objectif',ph:'Ex: Voiture'},{k:'target',lb:'Montant cible (€)',ph:'0.00'},{k:'reached',lb:'Déjà atteint (€)',ph:'0.00'},{k:'deadline',lb:'Date limite',ph:''}].map(f=>(
            <div key={f.k} style={{flex:1,minWidth:130}}>
              <div style={{fontSize:11,color:txtM,marginBottom:4,fontWeight:600}}>{f.lb}</div>
              <input type={f.k==='target'||f.k==='reached'?'number':f.k==='deadline'?'date':'text'}
                value={fObj[f.k]} placeholder={f.ph}
                onChange={e=>setFObj(p=>({...p,[f.k]:e.target.value}))}
                style={{background:white,border:`1.5px solid ${beige2}`,borderRadius:10,
                  padding:'7px 12px',fontSize:13,color:txt,outline:'none',width:'100%'}}
                onFocus={e=>e.target.style.borderColor=sage}
                onBlur={e=>e.target.style.borderColor=beige2}/>
            </div>
          ))}
          <Btn onClick={()=>{
            if(!fObj.name||!fObj.target)return;
            setObjs(p=>[...p,{id:uid(),name:fObj.name,target:Number(fObj.target),reached:Number(fObj.reached)||0,deadline:fObj.deadline}]);
            setFObj({name:'',target:'',reached:'',deadline:''});
          }}>+ Ajouter</Btn>
        </div>
      </div>
    </div>
  );

  const Charts=()=>(
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))',gap:20}}>
      <div className="card">
        <h3 style={{marginBottom:16}}>Dépenses par catégorie</h3>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:16}}>
          <Pie data={byCat} size={180}/>
          <div style={{width:'100%',display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            {byCat.map((d,i)=>(
              <div key={i} style={{display:'flex',alignItems:'center',gap:6}}>
                <div style={{width:10,height:10,borderRadius:3,background:PIE[i%PIE.length],flexShrink:0}}/>
                <span style={{fontSize:11,color:txt,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.lb}</span>
                <span style={{fontSize:11,fontWeight:700,color:txtM}}>{eur(d.v)}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div className="card">
        <h3 style={{marginBottom:16}}>Évolution mensuelle</h3>
        <div style={{display:'flex',gap:12,marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:12,height:12,borderRadius:3,background:sage}}/><span style={{fontSize:12,color:txtM}}>Revenus</span></div>
          <div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:12,height:12,borderRadius:3,background:gold}}/><span style={{fontSize:12,color:txtM}}>Dépenses</span></div>
        </div>
        <Bars data={monthly} h={200}/>
      </div>
      <div className="card">
        <h3 style={{marginBottom:16}}>Revenus vs Dépenses</h3>
        <Bars data={[
          {lb:'Revenus',rev:st.totR},
          {lb:'Dépenses',dep:st.totD},
          {lb:'Solde',rev:Math.max(0,st.bal),dep:Math.max(0,-st.bal)},
        ]} h={200}/>
        <div style={{marginTop:16,padding:12,background:sagePale,borderRadius:10}}>
          <div style={{fontSize:12,color:sageDk,fontWeight:700,marginBottom:4}}>Taux d'épargne</div>
          <Prog v={Math.max(0,st.epRate)}/>
          <div style={{fontSize:20,fontWeight:800,color:sageDk,marginTop:6}}>{Math.max(0,st.epRate)}%</div>
        </div>
      </div>
      <div className="card">
        <h3 style={{marginBottom:16}}>Charges fixes vs Variables</h3>
        <Bars data={[{lb:'Fixes',dep:st.fix},{lb:'Variables',rev:st.vari}]} h={160}/>
        <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:10}}>
          {[{lb:'Charges fixes',val:st.fix,col:terra},{lb:'Variables',val:st.vari,col:lav}].map((r,i)=>(
            <div key={i}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
                <span style={{color:txt}}>{r.lb}</span>
                <span style={{fontWeight:700,color:r.col}}>{eur(r.val)}</span>
              </div>
              <Prog v={pct(r.val,st.totD)} color={r.col} bg={r.col+'22'}/>
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  const SECTIONS={dash:<Dash/>,rev:<Revenus/>,dep:<Depenses/>,ep:<Epargne/>,dette:<Dettes/>,vac:<Vacances/>,abo:<Abonnements/>,obj:<Objectifs/>,chart:<Charts/>};

  return(
    <div style={{minHeight:'100vh',background:cream}}>

      {/* Header */}
      <div style={{background:`linear-gradient(135deg,${sageDk},${sage})`,padding:'20px 28px',
        display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div>
          <div style={{color:goldLt,fontSize:12,fontWeight:600,letterSpacing:3,textTransform:'uppercase',marginBottom:4}}>Tableau de bord financier</div>
          <div style={{color:'#fff',fontSize:24,fontWeight:800,letterSpacing:.5}}>✦ Mon Budget Personnel</div>
        </div>
        <div style={{display:'flex',gap:20,flexWrap:'wrap'}}>
          {[
            {lb:'Revenus',val:eur(st.totR),col:sageLt},
            {lb:'Dépenses',val:eur(st.totD),col:goldLt},
            {lb:'Solde',val:eur(st.bal),col:st.bal>=0?'#fff':rose},
          ].map((s,i)=>(
            <div key={i} style={{textAlign:'center'}}>
              <div style={{fontSize:10,color:s.col+'cc',fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>{s.lb}</div>
              <div style={{fontSize:18,fontWeight:800,color:s.col}}>{s.val}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Nav */}
      <div style={{background:white,borderBottom:`2px solid ${beige}`,padding:'0 20px',display:'flex',gap:2,overflowX:'auto'}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            background:'none',border:'none',cursor:'pointer',padding:'14px 14px',
            fontSize:13,fontWeight:tab===t.id?700:500,
            color:tab===t.id?sageDk:txtM,
            borderBottom:`2px solid ${tab===t.id?sage:'transparent'}`,
            marginBottom:-2,whiteSpace:'nowrap',transition:'all .2s',fontFamily:'inherit',
          }}>
            <span style={{marginRight:5}}>{t.ic}</span>{t.lb}
          </button>
        ))}
      </div>

      {/* Contenu */}
      <div style={{maxWidth:1200,margin:'0 auto',padding:'24px 20px'}}>
        <div style={{marginBottom:20}}>
          <h2 style={{fontSize:20,fontWeight:800,color:txt,letterSpacing:.3}}>
            {TABS.find(t=>t.id===tab)?.ic} {TABS.find(t=>t.id===tab)?.lb}
          </h2>
        </div>
        {SECTIONS[tab]}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
